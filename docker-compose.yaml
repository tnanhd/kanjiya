services:
  postgres-db:
    image: postgres:16-alpine
    container_name: kanji-db-container
    environment:
      POSTGRES_DB: kanjiya
      POSTGRES_USER: root
      POSTGRES_PASSWORD: s3cret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d kanjiya" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kanjiya-app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: kanjiya-container
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/kanjiya
      DB_USERNAME: root
      DB_PASSWORD: s3cret
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
